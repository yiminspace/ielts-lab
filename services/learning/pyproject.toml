[project]
name = "ielts-learning"
version = "0.1.0"
description = "IELTS domain workflows for the personal agent runtime"
requires-python = ">=3.12"
dependencies = [
  "agent-runtime>=0.1.0,<0.2",
  "pydantic-ai-slim[openai]>=1.0,<3",
  "pydantic-graph>=1.0,<3",
  "fastapi>=0.115,<1",
  "httpx[socks]>=0.28,<1",
  "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ielts_learning"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.uv.sources]
agent-runtime = { git = "https://github.com/yiminspace/agent-runtime.git", rev = "743264f5f50a36cb59563304d5a5082f7f7add49" }
